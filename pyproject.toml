[project]
name = "package-manager-hardening"
version = "0.0.0"
description = "Package manager hardening skill and tests"
requires-python = ">=3.10,<3.15"

[dependency-groups]
dev = [
    "ruff==0.16.5",
    "pytest==9.1.1",
    "hypothesis==6.165.10",
]

[tool.uv]
# Release-age cooldown is handled at the PR level by the Dependabot `uv`
# ecosystem cooldown in .github/dependabot.yml. We deliberately do NOT set a
# resolver-level `exclude-newer` cooldown here: it has no security-update
# exception, so it would block Dependabot's automated security updates and
# force manual version bumps + lockfile regeneration for every CVE fix. See
# docs/dependabot.md (Cooldown: resolver-level vs Dependabot) — pick one;
# we prioritise Dependabot for the security-autoupdate ergonomics.

[tool.uv.pip]
# If anyone uses `uv pip install` directly (outside of `uv sync`),
# require hashes and verify them.
require-hashes = true
verify-hashes = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
