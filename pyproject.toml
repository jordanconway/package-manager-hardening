[project]
name = "package-manager-hardening"
version = "0.0.0"
description = "Package manager hardening skill and tests"
requires-python = ">=3.10,<3.15"

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "pytest==9.0.3",
    "hypothesis==6.152.4",
]

[tool.uv]
# Hardening: refuse to resolve anything published in the last 7 days.
# Rolling cooldown against compromised-release attacks — re-evaluated
# every time the lockfile is refreshed (uv lock), no manual date bump.
# Hash verification of resolved artefacts is automatic via uv.lock +
# `uv sync --frozen` — no separate flag needed.
exclude-newer = "7 days"

[tool.uv.pip]
# If anyone uses `uv pip install` directly (outside of `uv sync`),
# require hashes and verify them.
require-hashes = true
verify-hashes = true

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
