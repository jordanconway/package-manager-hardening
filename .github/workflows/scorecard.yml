# OpenSSF Scorecard — automated supply-chain posture scoring.
# Runs weekly + on pushes to main; uploads SARIF to the Security tab and
# publishes results so the README badge resolves.
#
# Docs: https://github.com/ossf/scorecard-action
# Checks: https://github.com/ossf/scorecard/blob/main/docs/checks.md

name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "37 5 * * 1"  # weekly, Monday 05:37 UTC
  push:
    branches: [main]
  workflow_dispatch:  # allow manual `gh workflow run scorecard.yml`

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    permissions:
      security-events: write  # upload SARIF results to the Security tab
      id-token: write         # publish results to OpenSSF (resolves README badge)
      contents: read          # checkout
      actions: read           # scorecard reads workflow files/runs to score token-permissions + pinned-deps
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit  # scorecard contacts many external endpoints; audit is the documented mode
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to OpenSSF so the README badge works.
          publish_results: true
          # Fine-grained PAT with Administration: Read-only on this repo.
          # Required because the default GITHUB_TOKEN cannot read classic
          # branch protection rules (the API the Branch-Protection check
          # uses). Without this, the action fails with:
          #   "some github tokens can't read classic branch protection rules"
          # Docs: https://github.com/ossf/scorecard-action/blob/main/docs/authentication/fine-grained-auth-token.md
          repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
