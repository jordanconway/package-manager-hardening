# SPDX-FileCopyrightText: 2026 The Linux Foundation
# SPDX-License-Identifier: MIT

version = 1

# uv.lock is generated by `uv lock` and cannot carry an inline SPDX header
# (uv would treat any added comments as part of the lockfile contents and
# overwrite them on the next regeneration).
[[annotations]]
path = "uv.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "MIT"
