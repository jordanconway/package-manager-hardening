# SPDX-License-Identifier: MIT

version = 1

# uv.lock is generated by `uv lock` and cannot carry an inline SPDX header
# (uv would treat any added comments as part of the lockfile contents and
# overwrite them on the next regeneration).
[[annotations]]
path = "uv.lock"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "MIT"

# package-lock.json is generated by `npm install --package-lock-only` and
# cannot carry an SPDX header (npm has no comment syntax for JSON and would
# strip any added fields on the next regeneration).
[[annotations]]
path = "package-lock.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "MIT"

# package.json is JSON; no comment syntax for an inline SPDX header.
[[annotations]]
path = "package.json"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The Linux Foundation"
SPDX-License-Identifier = "MIT"
